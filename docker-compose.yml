services:
  postgres:
    image: postgres:16-alpine
    container_name: recoffee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recoffee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recoffee_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recoffee-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoffee-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=recoffee_db;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recoffee-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recoffee-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - recoffee-network

  iiot-simulator:
    build:
      context: ./iiot-simulator
      dockerfile: Dockerfile
    container_name: recoffee-iiot-simulator
    profiles:
      - simulator
    environment:
      - API_URL=http://backend:5000/api/iiot/telemetry
    depends_on:
      - backend
    networks:
      - recoffee-network

volumes:
  postgres_data:
    driver: local

networks:
  recoffee-network:
    driver: bridge
